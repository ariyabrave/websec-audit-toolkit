[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "websec-audit-toolkit"
version = "0.1.0"
description = "A modular Web and API security assessment toolkit for authorized security testing."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
websec = "websec_audit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]